# Modules this realm runs, pinned to the commit it was built against.
#
# Nothing else records this. The modules are ordinary clones inside
# modules/, not submodules, so a fresh checkout gets whatever each
# project's default branch happens to be that day - which is how a
# rebuilt server quietly stops matching the one it replaced.
#
# Restore with deploy/clone-modules.sh, or by hand:
#     git clone <url> modules/<name> && git -C modules/<name> checkout <commit>
#
# name  url  commit
