[worldserver]

########################################
# Bulletin Board
########################################
#
#    BulletinBoard.Enable
#        Description: Turn the boards on. With this off the module loads and
#                     does nothing, which is what a server that has the module
#                     installed but no content wants.
#        Default:     1
#

BulletinBoard.Enable = 1

#
#    BulletinBoard.ShowToBots
#        Description: Whether player bots may see and take contracts. Off by
#                     default: on a realm where bots outnumber players the
#                     rotations empty before anyone arrives, and a bounty is
#                     claimed by something that had no use for it.
#
#                     Bots are recognised from the playerbots module's own
#                     account record, not guessed from account names, so this
#                     costs nothing on a realm that has no bots.
#        Default:     0
#

BulletinBoard.ShowToBots = 0
